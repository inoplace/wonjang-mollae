<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>원장님몰래 · 운영 대시보드</title>
<style>
  :root {
    color-scheme: dark;
    --page:#0a0a0c; --surface:#141417; --surface2:#1b1b1f;
    --ink1:#f5f5f4; --ink2:#b9b9b3; --ink3:#7d7d78;
    --mint:#3DF2B6; --mint-dim:rgba(61,242,182,.14);
    --grid:#232327; --axis:#3a3a40; --border:rgba(255,255,255,.08);
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --blue:#3987e5; --orange:#d95926;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--page); color:var(--ink1);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  .wrap { max-width:880px; margin:0 auto; display:grid; gap:12px; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:4px 2px; }
  .brand { font-size:20px; font-weight:800; letter-spacing:-.5px; }
  .brand em { font-style:normal; color:var(--mint); }
  .brand small { font-size:12px; font-weight:600; color:var(--ink3); margin-left:8px; }
  .sub { font-size:12px; color:var(--ink3); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .tile .k { font-size:11px; font-weight:600; color:var(--ink3); letter-spacing:.4px; margin-bottom:8px; text-transform:uppercase; }
  .tile .v { font-size:28px; font-weight:800; line-height:1; letter-spacing:-.5px; }
  .tile.hero .v { font-size:38px; color:var(--mint); }
  .tile .d { font-size:12px; color:var(--ink3); margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; background:var(--surface2); color:var(--ink2); }
  .chip.up { background:var(--mint-dim); color:var(--mint); }
  h2 { font-size:12px; font-weight:700; color:var(--ink3); letter-spacing:.5px; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
  .status { display:inline-flex; align-items:center; gap:7px; font-weight:800; font-size:16px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--ink3); font-weight:600; font-size:11px; padding:6px 8px; border-bottom:1px solid var(--grid); }
  td { padding:8px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; color:var(--ink2); }
  td:first-child { color:var(--ink1); }
  td a { color:var(--mint); text-decoration:none; font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .num { text-align:right; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:10px; font-size:13px; font-weight:700;
    text-decoration:none; border:1px solid var(--border); color:var(--ink1); background:var(--surface2); }
  .btn.primary { background:var(--mint); color:#0a0a0c; border-color:transparent; }
  .btn.danger { color:#ff7a76; border-color:rgba(255,122,118,.4); background:transparent; }
  .chartbox { position:relative; }
  #tip { position:absolute; pointer-events:none; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; font-size:12px; display:none; white-space:nowrap; color:var(--ink1); }
  #tip b { color:var(--mint); font-variant-numeric:tabular-nums; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-left:auto; }
  .seg button { background:transparent; border:none; color:var(--ink3); font-size:11px; font-weight:700; padding:5px 12px; cursor:pointer; }
  .seg button.on { background:var(--mint-dim); color:var(--mint); }
  .tgl { font-size:11px; color:var(--ink3); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; font-weight:600; }
  .today { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .today img { width:130px; border-radius:10px; border:1px solid var(--border); display:block; }
  .today .info { flex:1; min-width:200px; }
  .today .links { font-size:14px; margin-top:6px; }
  .today .links a { color:var(--mint); text-decoration:none; font-weight:700; margin-right:14px; }
  .topic { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--grid); font-size:13px; align-items:baseline; color:var(--ink2); }
  .topic:last-child { border-bottom:none; }
  .topic.next { color:var(--ink1); }
  .badge { font-size:10px; font-weight:800; padding:2px 8px; border-radius:99px; min-width:92px; text-align:center; letter-spacing:.3px; }
  .b-MONEY { background:rgba(61,242,182,.14); color:var(--mint); }
  .b-DATA { background:rgba(57,135,229,.16); color:#7ab3f0; }
  .b-COUNTER { background:rgba(217,89,38,.16); color:#f0926a; }
  .nextchip { font-size:10px; font-weight:800; color:#0a0a0c; background:var(--mint); border-radius:99px; padding:2px 7px; margin-left:6px; }
  .foot { font-size:12px; color:var(--ink3); display:flex; gap:16px; flex-wrap:wrap; padding:4px 2px 12px; }
  .foot a { color:var(--ink2); text-decoration:none; }
  .hidden { display:none; }
  @media (max-width:520px){ .tiles { grid-template-columns:1fr 1fr; } .tile.hero .v { font-size:32px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">원장님<em>몰래</em><small>운영 대시보드</small></div>
    <span class="sub" id="asof">불러오는 중…</span>
  </header>

  <div class="tiles">
    <div class="card tile hero"><div class="k">팔로워</div><div class="v" id="t-fol">–</div><div class="d" id="t-fol-d"></div></div>
    <div class="card tile"><div class="k">오늘 발행</div><div class="v" style="font-size:16px;margin-top:6px"><span class="status" id="t-pub"><span class="dot" style="background:var(--ink3)"></span>확인 중</span></div><div class="d" id="t-pub-d"></div></div>
    <div class="card tile"><div class="k">최근 7일 발행</div><div class="v" id="t-week">–</div><div class="d">카드+릴스 세트</div></div>
    <div class="card tile"><div class="k">대기 주제</div><div class="v" id="t-topics">–</div><div class="d" id="t-topics-d"></div></div>
  </div>

  <div class="card">
    <h2>팔로워 추이 <button class="tgl" id="tgl-tbl">표로 보기</button>
      <span class="seg"><button id="r7">7일</button><button id="rall" class="on">전체</button></span></h2>
    <div class="chartbox"><svg id="chart" width="100%" height="190" role="img" aria-label="팔로워 추이 선 차트"></svg><div id="tip"></div></div>
    <table id="fol-table" class="hidden"><thead><tr><th>날짜</th><th class="num">팔로워</th><th class="num">증감</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>오늘 콘텐츠</h2>
    <div class="today">
      <img id="today-img" alt="오늘 카드 표지" onerror="this.style.display='none'">
      <div class="info">
        <div class="sub" id="today-note">확인 중…</div>
        <div class="links" id="today-links"></div>
        <div class="btnrow">
          <a class="btn danger" id="btn-stop" target="_blank" rel="noopener">⛔ 발행 중지</a>
          <a class="btn" href="https://github.com/wonjang-mollae/wonjang-mollae.github.io/actions" target="_blank" rel="noopener">실행 로그</a>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>최근 게시물 반응</h2>
    <table id="media-table"><thead><tr><th>게시일</th><th>형식</th><th class="num">좋아요</th><th class="num">댓글</th><th>링크</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>주제 큐</h2>
    <div id="topics"></div>
    <div class="btnrow">
      <a class="btn primary" id="btn-add" target="_blank" rel="noopener">＋ 주제 추가</a>
      <a class="btn" href="https://github.com/wonjang-mollae/wonjang-mollae.github.io/edit/main/topics.json" target="_blank" rel="noopener">직접 편집</a>
    </div>
    <div class="sub" style="margin-top:10px">주제 추가 → 한글 양식 등록 → 30초 내 자동 반영됩니다. 맨 위 주제가 다음 발행분입니다.</div>
  </div>

  <div class="foot">
    <a href="https://www.instagram.com/wonjang.mollae/" target="_blank" rel="noopener">@wonjang.mollae</a>
    <a href="https://wonjang-mollae.github.io/" target="_blank" rel="noopener">셀프체크 계산기</a>
    <a href="https://github.com/wonjang-mollae/wonjang-mollae.github.io" target="_blank" rel="noopener">저장소</a>
    <span id="runinfo"></span>
  </div>
</div>

<script>
const REPO = 'wonjang-mollae/wonjang-mollae.github.io';
const kstNow = () => new Date(Date.now() + 9*3600*1000);
const kstDate = () => kstNow().toISOString().slice(0,10);
const fmt = n => n==null ? '–' : n.toLocaleString('ko-KR');
const $ = id => document.getElementById(id);
const rel = iso => { const m = Math.round((Date.now()-new Date(iso))/60000);
  return m<60 ? m+'분 전' : m<1440 ? Math.round(m/60)+'시간 전' : Math.round(m/1440)+'일 전'; };

{
  const body = encodeURIComponent(
`아래 형식을 채워 그대로 등록하세요. 등록하면 자동으로 주제 큐(topics.json)에 추가됩니다.

시리즈: MONEY CUT   (MONEY CUT / DATA CUT / COUNTER CUT 중 하나)
주제: 여기에 주제 한 줄
메모: (선택) 참고 링크나 방향`);
  $('btn-add').href = `https://github.com/${REPO}/issues/new?labels=topic-request&title=${encodeURIComponent('[주제추가] ')}&body=${body}`;
}

async function j(url){ const r = await fetch(url + (url.includes('?')?'&':'?') + 'v=' + Date.now()); if(!r.ok) throw r.status; return r.json(); }
let PTS = [], RANGE = 'all';

(async () => {
  try {
    const s = await j('stats.json');
    const snaps = Array.isArray(s) ? s : (s.snapshots||[]);
    const byDay = {};
    snaps.forEach(x => byDay[x.at.slice(0,10)] = x);
    const days = Object.keys(byDay).sort();
    PTS = days.map(d => ({ d, f: byDay[d].followers }));
    const last = byDay[days[days.length-1]];
    $('t-fol').textContent = fmt(last.followers);
    const dToday = PTS.length>=2 ? last.followers - PTS[PTS.length-2].f : 0;
    const i7 = Math.max(0, PTS.length-8);
    const d7 = last.followers - PTS[i7].f;
    $('t-fol-d').innerHTML =
      `<span class="chip ${dToday>=0?'up':''}">오늘 ${dToday>=0?'＋':''}${dToday}</span>` +
      `<span class="chip ${d7>=0?'up':''}">7일 ${d7>=0?'＋':''}${d7}</span>`;
    $('asof').textContent = '갱신 ' + rel(last.at) + ' · 매일 21:07 자동 수집';
    const week = (last.media||[]).filter(m => (Date.now()-new Date(m.ts)) < 7*86400e3).length;
    $('t-week').textContent = Math.ceil(week/2);
    drawChart();
    const tb = $('fol-table').querySelector('tbody');
    tb.innerHTML = PTS.map((p,i)=>{
      const df = i? p.f-PTS[i-1].f : 0;
      return `<tr><td>${p.d}</td><td class="num">${fmt(p.f)}</td><td class="num">${df>0?'+':''}${i?df:''}</td></tr>`;
    }).join('');
    const mb = $('media-table').querySelector('tbody');
    mb.innerHTML = (last.media||[]).slice(0,8).map(m=>{
      const t = m.type==='VIDEO' ? '릴스' : '카드';
      return `<tr><td>${m.ts.slice(5,10).replace('-','/')}</td><td>${t}</td><td class="num">${fmt(m.likes)}</td><td class="num">${fmt(m.comments)}</td><td><a href="${m.permalink}" target="_blank" rel="noopener">보기 ↗</a></td></tr>`;
    }).join('');
  } catch(e) { $('asof').textContent = '데이터 로드 실패'; }

  try {
    const t = await j('topics.json');
    const items = Array.isArray(t) ? t : (t.topics||[]);
    const wait = items.filter(x => x.status==='대기');
    $('t-topics').textContent = wait.length;
    $('t-topics-d').textContent = '주 5회 기준 약 ' + (wait.length/5).toFixed(1) + '주분';
    $('topics').innerHTML = wait.map((x,i) => {
      const key = (x.series||'').split(' ')[0];
      return `<div class="topic ${i===0?'next':''}"><span class="badge b-${key}">${x.series||''} ${x.issueNo||''}</span><span>${x.topic||''}${i===0?'<span class="nextchip">다음 발행</span>':''}</span></div>`;
    }).join('') || '<div class="sub">대기 주제가 없습니다 — 일요일 밤 자동 보충 예정</div>';
  } catch(e) {}

  const today = kstDate();
  $('today-img').src = `posts/${today}/card1.png`;
  try {
    const p = await j(`posts/${today}/published.json`);
    setPub('good', '발행 완료', (p.carousel?.at ? rel(p.carousel.at) : ''));
    $('today-note').textContent = '오늘자 카드·릴스가 인스타그램에 게시되었습니다.';
    const links = [];
    if (p.carousel?.permalink) links.push(`<a href="${p.carousel.permalink}" target="_blank" rel="noopener">카드 보기 ↗</a>`);
    if (p.reel?.permalink) links.push(`<a href="${p.reel.permalink}" target="_blank" rel="noopener">릴스 보기 ↗</a>`);
    $('today-links').innerHTML = links.join('');
  } catch(e) {
    const h = kstNow().getUTCHours();
    if (h < 10) { setPub('warn', '발행 전', '10:07 예정'); $('today-note').textContent = '오늘자 콘텐츠는 10:07에 자동 게시됩니다.'; }
    else if (h < 13) { setPub('warn', '진행 중', '10:07~12:43 슬롯'); $('today-note').textContent = '게시 진행 중이거나 대기 중입니다.'; }
    else { setPub('crit', '미발행', '점검 필요'); $('today-note').textContent = '오늘자 발행 기록이 없습니다 — 점검이 필요합니다.'; }
  }
  function setPub(kind, label, sub){
    const c = kind==='good' ? 'var(--good)' : kind==='warn' ? 'var(--warn)' : 'var(--crit)';
    $('t-pub').innerHTML = `<span class="dot" style="background:${c}"></span>${label}`;
    $('t-pub-d').textContent = sub;
  }

  try {
    const iss = await j(`https://api.github.com/repos/${REPO}/issues?state=open&labels=publish-queue`);
    $('btn-stop').href = iss.length ? iss[0].html_url : `https://github.com/${REPO}/issues?q=label%3Apublish-queue`;
    if (!iss.length) { $('btn-stop').textContent = '발행 대기 없음'; }
  } catch(e) { $('btn-stop').href = `https://github.com/${REPO}/issues`; }
  try {
    const r = await j(`https://api.github.com/repos/${REPO}/actions/workflows/publish.yml/runs?per_page=1`);
    const run = r.workflow_runs?.[0];
    if (run) $('runinfo').textContent = `최근 게시 실행 ${run.conclusion==='success'?'✅':run.conclusion||run.status} · ${rel(run.created_at)}`;
  } catch(e) {}
})();

function drawChart(){
  const pts = RANGE==='7' ? PTS.slice(-8) : PTS;
  if (!pts.length) return;
  const svg = $('chart'), tip = $('tip');
  const W = svg.clientWidth || 820, H = 190, m = {t:14, r:14, b:24, l:40};
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const xs = i => m.l + (W-m.l-m.r) * (pts.length===1 ? .5 : i/(pts.length-1));
  const fmin = Math.min(...pts.map(p=>p.f)), fmax = Math.max(...pts.map(p=>p.f));
  const lo = Math.max(0, Math.floor((fmin-5)/10)*10), hi = Math.ceil((fmax+5)/10)*10;
  const ys = v => m.t + (H-m.t-m.b) * (1 - (v-lo)/(hi-lo||1));
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  let g = `<defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${css('--mint')}" stop-opacity="0.18"/>
    <stop offset="1" stop-color="${css('--mint')}" stop-opacity="0"/></linearGradient></defs>`;
  for (let k=0;k<=2;k++){ const v = lo + (hi-lo)*k/2, y = ys(v);
    g += `<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="${css('--grid')}" stroke-width="1"/>`;
    g += `<text x="${m.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${css('--ink3')}" font-variant-numeric="tabular-nums">${v}</text>`; }
  const step = Math.max(1, Math.ceil(pts.length/6));
  pts.forEach((p,i)=>{ if(i%step===0 || i===pts.length-1)
    g += `<text x="${xs(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="${css('--ink3')}">${p.d.slice(5).replace('-','/')}</text>`; });
  const line = pts.map((p,i)=>`${i?'L':'M'}${xs(i)},${ys(p.f)}`).join('');
  g += `<path d="${line} L${xs(pts.length-1)},${H-m.b} L${xs(0)},${H-m.b} Z" fill="url(#mg)"/>`;
  g += `<path d="${line}" fill="none" stroke="${css('--mint')}" stroke-width="2" stroke-linejoin="round"/>`;
  const li = pts.length-1;
  g += `<circle cx="${xs(li)}" cy="${ys(pts[li].f)}" r="4" fill="${css('--mint')}" stroke="${css('--surface')}" stroke-width="2"/>`;
  g += `<text x="${Math.min(xs(li), W-m.r-8)}" y="${ys(pts[li].f)-10}" text-anchor="end" font-size="12" font-weight="700" fill="${css('--ink1')}">${pts[li].f}</text>`;
  g += `<line id="xh" x1="0" y1="${m.t}" x2="0" y2="${H-m.b}" stroke="${css('--axis')}" stroke-width="1" visibility="hidden"/>`;
  svg.innerHTML = g;
  const xh = svg.querySelector('#xh');
  svg.onmousemove = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX-r.left) * (W/r.width);
    let bi = 0, bd = 1e9;
    pts.forEach((p,i)=>{ const d = Math.abs(xs(i)-x); if(d<bd){bd=d;bi=i;} });
    xh.setAttribute('x1', xs(bi)); xh.setAttribute('x2', xs(bi)); xh.setAttribute('visibility','visible');
    tip.style.display='block';
    tip.innerHTML = `${pts[bi].d} · 팔로워 <b>${pts[bi].f}</b>`;
    const bx = svg.parentElement.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX-bx.left+12, bx.width-150)+'px';
    tip.style.top  = (ev.clientY-bx.top-36)+'px';
  };
  svg.onmouseleave = ()=>{ xh.setAttribute('visibility','hidden'); tip.style.display='none'; };
}
$('r7').onclick = ()=>{ RANGE='7'; $('r7').classList.add('on'); $('rall').classList.remove('on'); drawChart(); };
$('rall').onclick = ()=>{ RANGE='all'; $('rall').classList.add('on'); $('r7').classList.remove('on'); drawChart(); };
$('tgl-tbl').onclick = ()=>{
  const t = $('fol-table'), on = t.classList.toggle('hidden');
  $('tgl-tbl').textContent = on ? '표로 보기' : '차트만 보기';
};
</script>
</body>
</html>
