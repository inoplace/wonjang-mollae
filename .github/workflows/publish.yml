name: 자동 게시 (승인제 — 월수금 10/12/15/18시 승인 확인)
on:
  schedule:
    - cron: '0 1,3,6,9 * * 1,3,5'   # 월/수/금 10:00·12:00·15:00·18:00 KST에 승인 여부 확인
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 승인 확인 후 게시
        uses: actions/github-script@v7
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            if (!fs.existsSync('.last_post_dir')) { core.info('발행 대기 콘텐츠 없음'); return; }
            const dir = fs.readFileSync('.last_post_dir','utf8').trim();
            // 오늘 생성분인지 확인
            const today = new Date().toISOString().slice(0,10);
            if (!dir.includes(today)) { core.info(`오늘 생성분 아님(${dir}) — 게시 안 함`); return; }
            // 열려 있는 publish-queue 이슈 확인 (닫힘 = 이미 게시됨/거부됨)
            const issues = await github.rest.issues.listForRepo({ ...context.repo, labels: 'publish-queue', state: 'open' });
            if (!issues.data.length) { core.info('열린 발행 이슈 없음 — 이미 처리됨'); return; }
            const queueIssue = issues.data[0];
            const comments = await github.rest.issues.listComments({ ...context.repo, issue_number: queueIssue.number });
            // 명시적 거부: stop
            if (comments.data.some(c => /\bstop\b|거부/i.test(c.body))) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: queueIssue.number, body: '⛔ 거부 확인 — 게시하지 않습니다.' });
              await github.rest.issues.update({ ...context.repo, issue_number: queueIssue.number, state: 'closed' });
              return;
            }
            // 승인 없으면 게시하지 않음 (다음 확인 시각까지 대기)
            const approved = comments.data.some(c => /승인|\bgo\b|\bok\b|👍/i.test(c.body));
            if (!approved) { core.info('아직 승인 없음 — 게시 대기 (승인제)'); return; }
            // 승인됨 → Graph API 게시
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}`;
            try {
              execSync(`IMG_BASE_URL="${base}" node publish_carousel.js "${dir}"`, { stdio: 'inherit', env: { ...process.env, IMG_BASE_URL: base } });
              // 릴스 게시 (있으면) — 실패해도 캐러셀 성공은 유지
              let reelNote = '';
              if (fs.existsSync(`${dir}/reel.mp4`)) {
                try {
                  execSync(`node publish_reel.js "${dir}"`, { stdio: 'inherit', env: { ...process.env, IMG_BASE_URL: base } });
                  reelNote = ' + 릴스 게시 완료 🎬';
                } catch (re) {
                  reelNote = `\n⚠️ 릴스 게시는 실패 — 카드 게시는 성공. \`${re.message}\``;
                }
              }
              await github.rest.issues.createComment({ ...context.repo, issue_number: queueIssue.number, body: `✅ 승인 확인 → 인스타그램 게시 완료${reelNote}` });
              await github.rest.issues.update({ ...context.repo, issue_number: queueIssue.number, state: 'closed' });
            } catch (e) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: queueIssue.number, body: `❌ 게시 실패 — IG 토큰 등록/만료 여부를 확인하세요. 다음 확인 시각에 자동 재시도합니다.\n\n\`${e.message}\`` });
              throw e;
            }
