name: 자동 게시 (월수금 10:00 KST)
on:
  schedule:
    - cron: '0 1 * * 1,3,5'   # 월/수/금 01:00 UTC = 10:00 KST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 거부권 확인 후 게시
        uses: actions/github-script@v7
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            if (!fs.existsSync('.last_post_dir')) { core.info('발행 대기 콘텐츠 없음'); return; }
            const dir = fs.readFileSync('.last_post_dir','utf8').trim();
            // 오늘 생성분인지 확인
            const today = new Date().toISOString().slice(0,10);
            if (!dir.includes(today)) { core.info(`오늘 생성분 아님(${dir}) — 게시 안 함`); return; }
            // publish-queue 이슈에서 stop 댓글 확인
            const issues = await github.rest.issues.listForRepo({ ...context.repo, labels: 'publish-queue', state: 'open' });
            let vetoed = false, queueIssue = null;
            for (const issue of issues.data) {
              queueIssue = issue;
              const comments = await github.rest.issues.listComments({ ...context.repo, issue_number: issue.number });
              if (comments.data.some(c => /\bstop\b/i.test(c.body))) vetoed = true;
            }
            if (vetoed) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: queueIssue.number, body: '⛔ 거부 확인 — 게시하지 않았습니다.' });
              await github.rest.issues.update({ ...context.repo, issue_number: queueIssue.number, state: 'closed' });
              return;
            }
            // Graph API 게시
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}`;
            try {
              execSync(`IMG_BASE_URL="${base}" node publish_carousel.js "${dir}"`, { stdio: 'inherit', env: { ...process.env, IMG_BASE_URL: base } });
              // 릴스 게시 (있으면) — 실패해도 캐러셀 성공은 유지
              let reelNote = '';
              if (fs.existsSync(`${dir}/reel.mp4`)) {
                try {
                  execSync(`node publish_reel.js "${dir}"`, { stdio: 'inherit', env: { ...process.env, IMG_BASE_URL: base } });
                  reelNote = ' + 릴스 게시 완료 🎬';
                } catch (re) {
                  reelNote = `\n⚠️ 릴스 게시는 실패 — 카드 게시는 성공. \`${re.message}\``;
                }
              }
              if (queueIssue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: queueIssue.number, body: `✅ 인스타그램 게시 완료${reelNote}` });
                await github.rest.issues.update({ ...context.repo, issue_number: queueIssue.number, state: 'closed' });
              }
            } catch (e) {
              if (queueIssue) await github.rest.issues.createComment({ ...context.repo, issue_number: queueIssue.number, body: `❌ 게시 실패 — 토큰 만료 여부를 확인하세요.\n\n\`${e.message}\`` });
              throw e;
            }
